<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Inter", "DejaVu Sans", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
    background: #0d1017;
    color: #e8edf5;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 88px;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .glow-a { width: 620px; height: 620px; right: -160px; top: -240px; background: rgba(34,197,94,.30); }
  .glow-b { width: 560px; height: 560px; left: -200px; bottom: -260px; background: rgba(99,102,241,.28); }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(circle at 30% 40%, #000 25%, transparent 78%);
  }
  .content { position: relative; z-index: 2; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 20px; letter-spacing: .16em; text-transform: uppercase;
    color: #22c55e; font-weight: 600; margin-bottom: 26px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 14px #22c55e; }
  h1 { font-size: 82px; line-height: 1.06; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { color: #22c55e; }
  .sub { margin-top: 22px; font-size: 30px; color: #9aa7bb; font-weight: 500; }
  .sub b { color: #e8edf5; font-weight: 700; }
  .tags { margin-top: 40px; display: flex; gap: 14px; }
  .tag {
    font-size: 21px; padding: 11px 22px; border-radius: 999px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
    color: #cfd8e6; font-weight: 500;
  }
  .foot {
    position: absolute; left: 88px; bottom: 46px; z-index: 2;
    display: flex; align-items: center; gap: 16px;
    font-size: 20px; color: #7d8ba1;
  }
  .foot .sep { width: 5px; height: 5px; border-radius: 50%; background: #47536b; }
  .foot .site { color: #e8edf5; font-weight: 700; }
</style>
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="grid"></div>
  <div class="content">
    <div class="eyebrow"><span class="dot"></span>personal blog &middot; knowledge base</div>
    <h1>Csurfing's <span class="accent">Agent Lab</span></h1>
    <div class="sub"><b>csurfing.xyz</b> — Agent 记忆系统 · 工程实践 · 学习笔记</div>
    <div class="tags">
      <div class="tag">Agent Memory</div>
      <div class="tag">Systems &amp; Workflow</div>
      <div class="tag">Study Notes</div>
    </div>
  </div>
  <div class="foot">
    <span class="site">Astro + Mizuki</span><span class="sep"></span>
    <span>Cloudflare Pages</span><span class="sep"></span>
    <span>github.com/C-surfing/csurfing-blog</span>
  </div>
</body>
</html>
