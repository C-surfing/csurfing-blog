<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Four Biases · 统一图谱">
<rect width="1200" height="100%" fill="#f4f8fc"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif}.title{font-size:30px;font-weight:750;fill:#11243a}.sub{font-size:15px;fill:#527087}.h{font-size:21px;font-weight:700;fill:#11243a}.body{font-size:16px;fill:#394e62}.tiny{font-size:13px;fill:#64788c}</style>
<text x="48" y="53" class="title">Four Biases · 统一图谱</text>
<text x="48" y="82" class="sub">它们相互影响，但不能简单地用一个分数互相替代</text>
<rect x="38" y="118" width="548" height="167" rx="16" fill="#ffffff" stroke="#dce6ee" stroke-width="1.5"/>
<rect x="38" y="118" width="7" height="167" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="60" y="153" class="h">Popularity Bias</text>
<text x="60" y="188" class="body">热门物品被更多推荐</text>
<text x="60" y="216" class="body">关注：长尾机会 / 过度集中</text>
<text x="60" y="244" class="body">诊断：ARP, PopREO</text>
<rect x="618" y="118" width="548" height="167" rx="16" fill="#ffffff" stroke="#dce6ee" stroke-width="1.5"/>
<rect x="618" y="118" width="7" height="167" rx="3" fill="#7654c9" stroke="#7654c9" stroke-width="1.5"/>
<text x="640" y="153" class="h">Position Bias</text>
<text x="640" y="188" class="body">列表靠前更容易被关注</text>
<text x="640" y="216" class="body">关注：同候选下位置扰动</text>
<text x="640" y="244" class="body">诊断：位置敏感性 / 配对差异</text>
<rect x="38" y="316" width="548" height="167" rx="16" fill="#ffffff" stroke="#dce6ee" stroke-width="1.5"/>
<rect x="38" y="316" width="7" height="167" rx="3" fill="#d28b24" stroke="#d28b24" stroke-width="1.5"/>
<text x="60" y="351" class="h">Selection Bias</text>
<text x="60" y="386" class="body">谁愿意打分、哪些评分被记录</text>
<text x="60" y="414" class="body">关注：观察样本 MNAR</text>
<text x="60" y="442" class="body">识别：随机评分/倾向信息</text>
<rect x="618" y="316" width="548" height="167" rx="16" fill="#ffffff" stroke="#dce6ee" stroke-width="1.5"/>
<rect x="618" y="316" width="7" height="167" rx="3" fill="#0f9eac" stroke="#0f9eac" stroke-width="1.5"/>
<text x="640" y="351" class="h">Exposure Bias</text>
<text x="640" y="386" class="body">哪些物品拥有被看到的机会</text>
<text x="640" y="414" class="body">关注：曝光策略造成的样本倾斜</text>
<text x="640" y="442" class="body">识别：随机曝光/策略日志</text>
<text x="1150" y="543" class="tiny" text-anchor="end">CSURFING  /  RSI DEBIAS</text>
</svg>